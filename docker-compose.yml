version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: binge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: binge
      POSTGRES_PASSWORD: binge_dev_pw
      POSTGRES_DB: binge_intelligence
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d   # sql/scripts run once on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binge -d binge_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: binge_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@binge.local
      PGADMIN_DEFAULT_PASSWORD: admin_dev_pw
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: binge_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: binge_admin
      MINIO_ROOT_PASSWORD: binge_dev_pw
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  minio_data: